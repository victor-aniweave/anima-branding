<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>ANIWEAVE 員工名片產生器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html {
            background: #fff;
        }

        body {
            font-family: "Nunito Sans", "Noto Sans TC", Arial, sans-serif;
            max-width: 1080px;
            margin: 40px auto;
            padding: 0 24px 80px;
            color: #33454E;
            background: #fff;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        h2 {
            font-size: 14px;
            font-weight: 700;
            margin: 24px 0 8px;
        }

        p,
        li {
            font-size: 13px;
            line-height: 1.7;
            margin: 0 0 4px;
        }

        ol {
            padding-left: 20px;
        }

        .divider {
            border: none;
            border-top: 1px solid #D9D9D9;
            margin: 40px 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 10px 12px;
            align-items: center;
            max-width: 460px;
            margin: 12px 0 20px;
        }

        .form-grid label {
            font-size: 13px;
            color: #33454E;
        }

        .form-grid input {
            font-family: inherit;
            font-size: 13px;
            padding: 6px 8px;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            color: #33454E;
            width: 100%;
            box-sizing: border-box;
        }

        .form-grid input:focus {
            outline: none;
            border-color: #80D4FF;
        }

        .form-grid .subrow {
            grid-column: 1 / -1;
            font-size: 12px;
            color: #8C8C8C;
            margin: -4px 0 2px;
        }

        .preview-area {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 12px 0 20px;
        }

        .preview-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preview-item > span {
            font-size: 12px;
            color: #8C8C8C;
        }

        .preview-scale {
            width: 450px;
            height: 270px;
            overflow: hidden;
            position: relative;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            background: #fafafa;
        }

        .card-face {
            width: 900px;
            height: 540px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: scale(0.5);
            transform-origin: top left;
            font-family: "Nunito Sans", "Noto Sans TC", sans-serif;
            box-sizing: border-box;
            overflow: hidden;
        }

        #cardBack img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ---- 正面卡片內容：座標直接取自 Figma node 329:2165 的 metadata（x/y/width/height），
               用 position:absolute 對應，不用 flex 湊間距，確保跟 Figma 完全一致 ---- */
        .name-en {
            position: absolute;
            left: 56px;
            top: 72px;
            font-family: "Nunito Sans", sans-serif;
            font-weight: 700;
            font-size: 48px;
            line-height: 1.1;
            color: #33454E;
            white-space: nowrap;
        }

        .name-zh {
            position: absolute;
            top: 72px;
            font-family: "Noto Sans TC", "Nunito Sans", sans-serif;
            font-weight: 700;
            font-size: 44px;
            line-height: 1.1;
            letter-spacing: 6.6px;
            color: #33454E;
            white-space: nowrap;
        }

        .title-row {
            position: absolute;
            left: 56px;
            top: 133px;
            font-family: "Nunito Sans", sans-serif;
            font-weight: 400;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #42BFFF;
            white-space: nowrap;
        }

        .website {
            position: absolute;
            left: 56px;
            top: 421px;
            height: 38px;
            display: flex;
            align-items: center;
            font-family: "Nunito Sans", sans-serif;
            font-size: 28px;
            letter-spacing: 0.56px;
            color: #33454E;
            white-space: nowrap;
        }

        .company-zh {
            position: absolute;
            left: 56px;
            top: 461.5px;
            width: 348px;
            height: 28px;
            display: flex;
            align-items: center;
            font-family: "Noto Sans TC", "Nunito Sans", sans-serif;
            font-size: 24px;
            line-height: 28px;
            letter-spacing: 0.96px;
            color: #33454E;
        }

        .label {
            position: absolute;
            left: 450px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Nunito Sans", sans-serif;
            font-weight: 700;
            font-size: 30px;
            line-height: 36px;
            letter-spacing: 0.6px;
            color: #33454E;
        }

        .pipe {
            position: absolute;
            left: 492px;
            width: 1px;
            height: 24px;
            background: #ABBDC5;
        }

        .value {
            position: absolute;
            left: 504px;
            height: 38px;
            display: flex;
            align-items: center;
            font-family: "Nunito Sans", "Noto Sans TC", sans-serif;
            font-size: 28px;
            letter-spacing: 0.56px;
            color: #33454E;
            white-space: nowrap;
        }

        .value.addr-value {
            width: 340px;
            height: auto;
            display: block;
            font-size: 24px;
            line-height: 28px;
            letter-spacing: 0.48px;
            white-space: normal;
        }

        .contact-row.mobile-hidden {
            display: none;
        }

        #copyStatus,
        #exportStatus {
            display: inline-block;
            margin: 8px 0 0;
            font-size: 13px;
        }

        #imageModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
        }

        #imageModal.open {
            display: flex;
        }

        #imageModal p {
            color: #fff;
            font-size: 14px;
            text-align: center;
            margin: 0 0 14px;
        }

        #imageModal img {
            max-width: 100%;
            max-height: 68vh;
            border-radius: 4px;
            -webkit-touch-callout: default;
        }

        #closeModalBtn {
            margin-top: 18px;
            padding: 9px 24px;
            border-radius: 4px;
            border: none;
            background: #fff;
            color: #1F59E0;
            font-weight: 700;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .btn {
            background: #1F59E0;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin: 0 8px 8px 0;
        }

        .btn:hover {
            background: #1C51CC;
        }

        .btn.secondary {
            background: #fff;
            color: #1F59E0;
            border: 1px solid #1F59E0;
        }

        .btn.secondary:hover {
            background: #EEF3FF;
        }
    </style>
</head>

<body>

    <h1>ANIWEAVE 員工名片產生器</h1>

    <h2>Step 1 — 用瀏覽器開啟</h2>
    <p><strong>用瀏覽器開啟這份 HTML 檔案</strong>（Chrome 或 Safari 皆可）。</p>

    <h2>Step 2 — 填入你的資料</h2>
    <p>下面欄位會即時更新下方的名片預覽，填完確認沒問題後直接下載 PNG 即可。</p>
    <div class="form-grid">
        <label for="nameEn">英文名</label>
        <input id="nameEn" type="text" value="Victor Chang">

        <label for="nameZh">中文名</label>
        <input id="nameZh" type="text" value="張庭維">

        <label for="title">職稱</label>
        <input id="title" type="text" value="UI/UX Designer">

        <label for="mobile">手機</label>
        <input id="mobile" type="text" value="+886 936 928 372">

        <label for="showMobile">顯示手機</label>
        <input id="showMobile" type="checkbox" checked style="width:auto;justify-self:start;">

        <label for="email">Email</label>
        <input id="email" type="text" value="victor.chang@aniweave.ai">

        <div class="subrow">以下公司資訊通常不需要更改：</div>

        <label for="tel">公司電話</label>
        <input id="tel" type="text" value="+886 2 2775 2099">

        <label for="website">網站</label>
        <input id="website" type="text" value="aniweave.ai">

        <label for="companyZh">公司名稱</label>
        <input id="companyZh" type="text" value="反著來股份有限公司">

        <label for="addr1">地址第一行</label>
        <input id="addr1" type="text" value="106 台北市大安區光復南路">

        <label for="addr2">地址第二行</label>
        <input id="addr2" type="text" value="72 巷 73 號 2 樓">
    </div>

    <h2>Step 3 — 預覽</h2>
    <p style="color:#8C8C8C;">正面會依你填的資料即時更新；背面是固定的品牌設計，不需要修改。</p>

    <div class="preview-area">
        <div class="preview-item">
            <span>正面</span>
            <div class="preview-scale">
                <div id="cardFront" class="card-face">
                    <span id="outNameEn" class="name-en"></span>
                    <span id="outNameZh" class="name-zh"></span>
                    <div id="outTitle" class="title-row"></div>
                    <div id="outWebsite" class="website"></div>
                    <div id="outCompanyZh" class="company-zh"></div>

                    <div class="contact-row" id="rowMobile">
                        <span class="label" id="labelMobile">M</span>
                        <span class="pipe" id="pipeMobile"></span>
                        <span class="value" id="outMobile"></span>
                    </div>
                    <div class="contact-row" id="rowTel">
                        <span class="label" id="labelTel">T</span>
                        <span class="pipe" id="pipeTel"></span>
                        <span class="value" id="outTel"></span>
                    </div>
                    <div class="contact-row" id="rowEmail">
                        <span class="label" id="labelEmail">E</span>
                        <span class="pipe" id="pipeEmail"></span>
                        <span class="value" id="outEmail"></span>
                    </div>
                    <div class="contact-row" id="rowAddress">
                        <span class="label" id="labelAddress">A</span>
                        <span class="pipe" id="pipeAddress"></span>
                        <span class="value addr-value" id="outAddress"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="preview-item">
            <span>背面（固定樣式）</span>
            <div class="preview-scale">
                <div id="cardBack" class="card-face">
                    <img src="" alt="ANIMA by ANIWEAVE">
                </div>
            </div>
        </div>
    </div>

    <h2>Step 4 — 下載 PNG</h2>
    <button id="downloadBothBtn" class="btn" type="button">下載正反面合併圖</button>
    <button id="downloadFrontBtn" class="btn secondary" type="button">下載正面 PNG</button>
    <button id="downloadBackBtn" class="btn secondary" type="button">下載背面 PNG</button>
    <br>
    <span id="exportStatus"></span>

    <hr class="divider">

    <div id="imageModal">
        <p>手機瀏覽器無法直接下載，請長按下方圖片，選擇「儲存圖片」即可存到相簿</p>
        <img id="modalImg" src="" alt="名片圖片">
        <button id="closeModalBtn" type="button">關閉</button>
    </div>

        document.getElementById('cardFront').style.backgroundImage = 'url("' + FRONT_BG_URL + '")';
        document.getElementById('cardBack').querySelector('img').src = BACK_IMG_URL;

        var CARD_W = 900, CARD_H = 540;
        var EXPORT_SCALE = 3; // 輸出 2700x1620，印刷用足夠銳利
        var NAME_MAX_WIDTH = 788; // 卡片內容可用寬度（900 - 56*2），姓名超過就自動縮小字級
        var NAME_EN_BASE = 48, NAME_ZH_BASE = 44;
        var NAME_MIN_SCALE = 0.55;
        var NAME_LEFT = 56, NAME_GAP = 32; // Figma: 56,72 起，兩段姓名 gap-32

        // 聯絡資訊每一列的座標（取自 Figma metadata，index 0 = 第一列 M 的位置）
        var ROW_STEP = 46;
        var LABEL_TOP0 = 296.5, PIPE_TOP0 = 299, VALUE_TOP0 = 293;
        var ADDR_VALUE_TOP_AT_INDEX3 = 435.5; // 地址列本身較高（padding-top 6.5），用實測值往回推其他 index
        var LABEL_LEFT0 = 450, PIPE_LEFT0 = 492, VALUE_LEFT0 = 504;
        var ADDR_WIDTH0 = 340;
        var WIDE_SHIFT = 24; // email 太長時，M/T/E/A 整組往左移動的量
        var EMAIL_REF_TEXT = 'victor.chang@aniweave.ai'; // 超過這個字串「實際渲染寬度」才觸發（字數一樣寬度不一定一樣，比對寬度才準）

        var fieldIds = ['nameEn', 'nameZh', 'title', 'mobile', 'tel', 'email', 'website', 'companyZh', 'addr1', 'addr2'];

        // 用隱藏元素量測文字實際渲染寬度，字型/letter-spacing 要跟 .value 完全一致
        var widthMeasureEl = document.createElement('span');
        widthMeasureEl.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;top:-9999px;left:-9999px;'
            + 'font-family:"Nunito Sans","Noto Sans TC",sans-serif;font-size:28px;letter-spacing:0.56px;';
        document.body.appendChild(widthMeasureEl);
        var emailRefWidth = null;
        function measureTextWidth(text) {
            widthMeasureEl.textContent = text;
            return widthMeasureEl.offsetWidth;
        }
        function isEmailWide(email) {
            if (emailRefWidth === null) emailRefWidth = measureTextWidth(EMAIL_REF_TEXT);
            return measureTextWidth(email) > emailRefWidth;
        }

        function positionRow(key, index, shift) {
            document.getElementById('label' + key).style.top = (LABEL_TOP0 + index * ROW_STEP) + 'px';
            document.getElementById('label' + key).style.left = (LABEL_LEFT0 - shift) + 'px';
            document.getElementById('pipe' + key).style.top = (PIPE_TOP0 + index * ROW_STEP) + 'px';
            document.getElementById('pipe' + key).style.left = (PIPE_LEFT0 - shift) + 'px';
            var valueTop = (key === 'Address')
                ? (ADDR_VALUE_TOP_AT_INDEX3 - (3 - index) * ROW_STEP)
                : (VALUE_TOP0 + index * ROW_STEP);
            var valueEl = document.getElementById('out' + key);
            valueEl.style.top = valueTop + 'px';
            valueEl.style.left = (VALUE_LEFT0 - shift) + 'px';
            if (key === 'Address') {
                valueEl.style.width = (ADDR_WIDTH0 + shift) + 'px';
            }
        }

        function layoutContactRows(showMobile, wide) {
            var shift = wide ? WIDE_SHIFT : 0;
            // 固定 index：M=0,T=1,E=2,A=3，隱藏手機只是空出那一格，其他列不會往上補位
            if (showMobile) {
                positionRow('Mobile', 0, shift);
            }
            positionRow('Tel', 1, shift);
            positionRow('Email', 2, shift);
            positionRow('Address', 3, shift);
        }

        function positionNameRow() {
            var enSpan = document.getElementById('outNameEn');
            var zhSpan = document.getElementById('outNameZh');
            zhSpan.style.left = (NAME_LEFT + enSpan.offsetWidth + NAME_GAP) + 'px';
        }

        function updateCard() {
            var nameEn = document.getElementById('nameEn').value;
            var nameZh = document.getElementById('nameZh').value;
            var title = document.getElementById('title').value;
            var mobile = document.getElementById('mobile').value;
            var tel = document.getElementById('tel').value;
            var email = document.getElementById('email').value;
            var website = document.getElementById('website').value;
            var companyZh = document.getElementById('companyZh').value;
            var addr1 = document.getElementById('addr1').value;
            var addr2 = document.getElementById('addr2').value;
            var showMobile = document.getElementById('showMobile').checked;

            document.getElementById('outNameEn').textContent = nameEn;
            document.getElementById('outNameZh').textContent = nameZh;
            document.getElementById('outTitle').textContent = title;
            document.getElementById('outMobile').textContent = mobile;
            document.getElementById('outTel').textContent = tel;
            document.getElementById('outEmail').textContent = email;
            document.getElementById('outWebsite').textContent = website;
            document.getElementById('outCompanyZh').textContent = companyZh;

            var wide = isEmailWide(email);
            document.getElementById('outAddress').innerHTML = wide ? (addr1 + ' ' + addr2) : (addr1 + '<br>' + addr2);

            document.getElementById('rowMobile').classList.toggle('mobile-hidden', !showMobile);
            layoutContactRows(showMobile, wide);

            fitNameRow();
        }

        function fitNameRow() {
            var enSpan = document.getElementById('outNameEn');
            var zhSpan = document.getElementById('outNameZh');
            enSpan.style.fontSize = NAME_EN_BASE + 'px';
            zhSpan.style.fontSize = NAME_ZH_BASE + 'px';

            var totalWidth = enSpan.offsetWidth + NAME_GAP + zhSpan.offsetWidth;
            if (totalWidth > NAME_MAX_WIDTH) {
                var scale = Math.max(NAME_MIN_SCALE, NAME_MAX_WIDTH / totalWidth);
                enSpan.style.fontSize = (NAME_EN_BASE * scale) + 'px';
                zhSpan.style.fontSize = (NAME_ZH_BASE * scale) + 'px';
            }
            positionNameRow();
        }

        fieldIds.forEach(function (id) {
            document.getElementById(id).addEventListener('input', updateCard);
        });
        document.getElementById('showMobile').addEventListener('change', updateCard);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(updateCard);
        }
        updateCard();

        function setStatus(msg, isError) {
            var el = document.getElementById('exportStatus');
            el.textContent = msg;
            el.style.color = isError ? '#c0392b' : '#2F88B5';
        }

        function isMobileBrowser() {
            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        function showImageModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.add('open');
        }

        document.getElementById('closeModalBtn').addEventListener('click', function () {
            document.getElementById('imageModal').classList.remove('open');
        });

        // 手機瀏覽器（尤其 iOS Safari）對 <a download> + data/blob URL 常常完全沒反應。
        // 這裡優先用原生分享（可直接存到相簿），分享不支援或被取消時，
        // 桌機退回傳統下載連結；手機則直接把圖片顯示出來讓使用者長按儲存，確保一定拿得到圖。
        function saveBlob(blob, filename) {
            // 電腦版一律直接下載，不要跳分享面板；分享面板只在手機（直接下載本身不可靠時）才用
            if (!isMobileBrowser()) {
                fallbackSave(blob, filename);
                return;
            }

            var file;
            try {
                file = new File([blob], filename, { type: blob.type || 'image/png' });
            } catch (e) {
                file = null;
            }

            if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file] }).then(function () {
                    setStatus(filename + ' 已透過分享儲存！');
                }).catch(function (err) {
                    if (err && err.name === 'AbortError') {
                        setStatus('已取消分享。');
                        return;
                    }
                    fallbackSave(blob, filename);
                });
                return;
            }

            fallbackSave(blob, filename);
        }

        function fallbackSave(blob, filename) {
            var url = URL.createObjectURL(blob);

            if (isMobileBrowser()) {
                showImageModal(url);
                setStatus('請長按下方圖片儲存到相簿。');
                return;
            }

            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
            setStatus(filename + ' 已下載！');
        }

        function renderFrontCanvas() {
            var frontEl = document.getElementById('cardFront');
            var originalTransform = frontEl.style.transform;
            frontEl.style.transform = 'none';
            return html2canvas(frontEl, {
                width: CARD_W,
                height: CARD_H,
                scale: EXPORT_SCALE,
                useCORS: true,
                backgroundColor: null
            }).then(function (canvas) {
                frontEl.style.transform = originalTransform;
                return canvas;
            }, function (err) {
                frontEl.style.transform = originalTransform;
                throw err;
            });
        }

        var nameEnForFile = function () {
            return (document.getElementById('nameEn').value || 'card').trim().replace(/\s+/g, '_');
        };

        document.getElementById('downloadFrontBtn').addEventListener('click', function () {
            setStatus('產生正面圖片中…');
            renderFrontCanvas().then(function (canvas) {
                canvas.toBlob(function (blob) {
                    saveBlob(blob, 'ANIWEAVE_名片正面_' + nameEnForFile() + '.png');
                }, 'image/png');
            }).catch(function (err) {
                console.error(err);
                setStatus('產生失敗，請確認網路連線後重試。', true);
            });
        });

        document.getElementById('downloadBackBtn').addEventListener('click', function () {
            setStatus('準備背面圖片中…');
            var backImg = new Image();
            backImg.onload = function () {
                // 輸出尺寸跟正面對齊（900x540 * EXPORT_SCALE），不要直接用原始素材的解析度
                var canvas = document.createElement('canvas');
                canvas.width = CARD_W * EXPORT_SCALE;
                canvas.height = CARD_H * EXPORT_SCALE;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(backImg, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(function (blob) {
                    saveBlob(blob, 'ANIWEAVE_名片背面.png');
                }, 'image/png');
            };
            backImg.onerror = function () {
                setStatus('背面圖片準備失敗，請確認網路連線後重試。', true);
            };
            backImg.src = BACK_IMG_URL;
        });

        document.getElementById('downloadBothBtn').addEventListener('click', function () {
            setStatus('產生合併圖片中…');
            renderFrontCanvas().then(function (frontCanvas) {
                var backImg = new Image();
                backImg.crossOrigin = 'anonymous';
                backImg.onload = function () {
                    var ratio = CARD_H / CARD_W;
                    var combined = document.createElement('canvas');
                    combined.width = frontCanvas.width;
                    combined.height = Math.round(frontCanvas.width * ratio * 2);
                    var ctx = combined.getContext('2d');
                    var faceH = Math.round(combined.width * ratio);
                    ctx.drawImage(frontCanvas, 0, 0, combined.width, faceH);
                    ctx.drawImage(backImg, 0, faceH, combined.width, faceH);
                    combined.toBlob(function (blob) {
                        saveBlob(blob, 'ANIWEAVE_名片正反面_' + nameEnForFile() + '.png');
                    }, 'image/png');
                };
                backImg.onerror = function () {
                    setStatus('背面圖片載入失敗，請確認網路連線後重試。', true);
                };
                backImg.src = BACK_IMG_URL;
            }).catch(function (err) {
                console.error(err);
                setStatus('產生失敗，請確認網路連線後重試。', true);
            });
        });
    </script>

</body>

</html>
